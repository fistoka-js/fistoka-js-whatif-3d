<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>whatif-3d player</title>
<link rel="icon" href="data:,">
<!-- The player page: plays kit/index.html?show=shows/<slug>. Add &render=1 for tools (no controls, frames on demand).
     Styles below: captions are the approved chameleon look (white, current word in the accent colour, heavy stroke).
     No CSS transitions or animations anywhere: every frame must be a pure function of t. -->
<style>
  html,body{margin:0;height:100%;background:#07080b;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#fff}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw * 16 / 9));overflow:hidden;background:#000;
    --u:10.8px;--accent:#ffe14d;user-select:none}
  body.render #stage{width:100vw;height:100vh;aspect-ratio:auto}
  body:not(.render) #stage{border-radius:18px;box-shadow:0 0 0 1px #222,0 20px 80px rgba(0,0,0,.7)}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #dip{position:absolute;inset:0;opacity:0;pointer-events:none}
  #shade{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55))}
  #ovsvg,#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ov-leader{stroke:#fff;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
  .ov-dot{fill:#fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
  .ov-label{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:.06em;font-size:calc(var(--u)*4.6);
    padding:calc(var(--u)*1.1) calc(var(--u)*2.4);border-radius:calc(var(--u)*5);background:rgba(10,14,24,.82);
    border:calc(var(--u)*.35) solid var(--accent);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.4) rgba(0,0,0,.45)}
  .ov-text{position:absolute;white-space:nowrap;font-weight:900;text-align:center;line-height:1.05;
    -webkit-text-stroke:calc(var(--u)*.55) rgba(0,0,0,.9);paint-order:stroke fill;text-shadow:0 calc(var(--u)*.5) calc(var(--u)*2) rgba(0,0,0,.6)}
  .ov-title{font-size:calc(var(--u)*9);letter-spacing:.04em}
  .ov-stamp{font-size:calc(var(--u)*12);color:#ff3d3d;-webkit-text-stroke:0;letter-spacing:.06em;
    border:calc(var(--u)*1.1) solid #ff3d3d;border-radius:calc(var(--u)*2.2);padding:0 calc(var(--u)*3);background:rgba(20,0,0,.35);
    text-shadow:none;box-shadow:0 0 calc(var(--u)*3) rgba(0,0,0,.5)}
  .ov-number{font-size:calc(var(--u)*15);color:var(--accent)}
  .ov-number .unit{font-size:.45em;color:#fff;letter-spacing:.04em}
  .ov-icon{position:absolute;width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;
    border:calc(var(--u)*.8) solid #fff;box-sizing:border-box;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*3) rgba(0,0,0,.5)}
  .ov-icon svg{width:100%;height:100%;display:block}
  #cap{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font-weight:900;line-height:1.14;font-size:calc(var(--u)*6.8);
    pointer-events:none;min-height:2.3em;display:flex;align-items:flex-end;justify-content:center}
  #cap .line{display:block}
  .w{display:inline-block;margin:0 .25em;color:#fff;opacity:.62;-webkit-text-stroke:.16em rgba(0,0,0,.9);paint-order:stroke fill;
    text-shadow:0 .06em .18em rgba(0,0,0,.6)}
  .w.past{opacity:1}
  .w.on{color:var(--accent);opacity:1;transform:scale(1.06)}
  #center{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2vh;z-index:6}
  #play{width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.93);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(0,0,0,.55)}
  #play svg{width:46%;height:46%;fill:#101418;margin-left:6%}
  #playlabel{font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 10px #000;font-size:calc(var(--u)*3.5)}
  #bar{position:absolute;left:0;right:0;bottom:0;height:16px;cursor:pointer;z-index:5}
  #barbg{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.2)}
  #fill{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent)}
  #msg{position:absolute;left:5%;right:5%;top:8%;z-index:8;background:rgba(10,12,16,.94);border:1px solid #844;border-radius:12px;
    padding:3% 4%;display:none;line-height:1.4;font-size:calc(var(--u)*2.8);white-space:pre-wrap;max-height:80%;overflow:auto}
  body.render #center, body.render #bar{display:none}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="dip"></div>
  <div id="shade"></div>
  <svg id="ovsvg"></svg>
  <div id="overlay"></div>
  <div id="cap"></div>
  <div id="center">
    <button id="play" aria-label="Play" disabled><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg></button>
    <div id="playlabel">Loading 3D…</div>
  </div>
  <div id="bar"><div id="barbg"></div><div id="fill"></div></div>
  <div id="msg"></div>
  <audio id="voice" preload="auto"></audio>
</div>
<script type="module" src="./engine/player.js"></script>
</body>
</html>
